[project]
name = "tracewise"
version = "0.0.1"
description = "CI failure diagnosis for GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: needs the approved test org (Phase 8); never run by default",
    "slow: large-input tests (AT-LOG-04, AT-SEC-15)",
]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001"]  # RUF001: jest/vitest glyphs (› ❯) are matched on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/tracewise/contracts.py" = ["S105"]  # enum value "config_secret" is a category name

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tracewise"]
plugins = ["pydantic.mypy"]
