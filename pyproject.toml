[project]
name = "tracewise"
version = "0.0.1"
description = "CI failure diagnosis for GitHub Actions"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: needs the approved test org (Phase 8); never run by default",
    "slow: large-input tests (AT-LOG-04, AT-SEC-15)",
]

[tool.ruff]
line-length = 130
# Benchmark fixtures are deliberately broken code and ground-truth data: never lint, format or fix them.
extend-exclude = ["src/tracewise/bench/cases"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001"]  # RUF001: jest/vitest glyphs (› ❯) are matched on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/tracewise/contracts.py" = ["S105"]  # enum value "config_secret" is a category name

[tool.mypy]
python_version = "3.12"
exclude = ["src/tracewise/bench/cases/"]
strict = true
mypy_path = "src"
packages = ["tracewise"]
plugins = ["pydantic.mypy"]

# ---- Vercel (website + waitlist API on one deployment; see web/docs/deployment.md). Nothing here runs locally.
[tool.vercel]
entrypoint = "web.vercel_app:app"

[tool.vercel.scripts]
build = "node web/build.mjs"
